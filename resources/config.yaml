version: 6

paths:
  installations:
    tie95: ""
    tie98: ""

audio:
  midi_backend: fm4_opl3
  music: imuse
  sb16_filter: true
  prefer_tie95_frontend_voices: true
  music_ducking_volume_percent: 37
  player_engine_sound_volume_percent: 30
  fluidsynth:
    soundfont_file: ""
  sc55:
    rom_directory: ""

ui:
  font: assets/fonts/menu

frontend:
  version: tie98
  aspect_correct_legacy_scenes: true

flight:
  version: tie98
  original_renderer: d3d
  update_rate: unlocked
  player_engine_sound: true
  models:
    source: original
    smooth_angle_degrees: 90
    opt_emissive_strength: 1.5
    opt_projectile_emissive_strength: 5.0

input:
  controllers: []
  gamepad_defaults:
    axes:
      yaw: {source: leftx, invert: false, deadzone: 0.08}
      pitch: {source: lefty, invert: false, deadzone: 0.08}
      roll: {source: rightx, invert: false, deadzone: 0.08}
      throttle: {source: 'none', invert: false}
    buttons:
      fire_weapon:
        - south
        - {axis: righttrigger, direction: positive, threshold: 0.5}
      target_roll_throttle_modifier:
        - east
        - {axis: lefttrigger, direction: positive, threshold: 0.5}
      target_nearest_fighter_or_mine: north
      target_next: west
      target_my_attacker: leftshoulder
      view_toggle_high_angle: rightshoulder
      throttle_full: dpadup
      throttle_down: dpaddown
      match_speed: dpadright
      target_clear: dpadleft
      hyperspace: leftstick
      pause: start
      escape: back
      view_return_to_cockpit: rightstick
  keyboard:
    info_previous_item:
      - {key: "Up"}
    info_next_item:
      - {key: "Down"}
    fire_weapon: []
    target_roll_throttle_modifier: []
    target_next:
      - {key: "T"}
    target_prev:
      - {key: "Y"}
    target_nearest_fighter_or_mine:
      - {key: "R"}
    target_my_attacker:
      - {key: "E"}
    target_attacker_chain:
      - {key: "A"}
    target_newest_craft:
      - {key: "U"}
    target_clear:
      - {key: "O"}
    auto_target:
      - {key: "1", modifiers: [alt]}
    cycle_warhead_view:
      - {key: "F2"}
    throttle_up:
      - {key: "="}
      - {key: "=", modifiers: [shift]}
      - {key: "Keypad +"}
    throttle_down:
      - {key: "-"}
      - {key: "Keypad -"}
    throttle_full:
      - {key: "Backspace"}
    match_speed:
      - {key: "Return"}
      - {key: "Keypad Enter"}
    cycle_weapon_group:
      - {key: "W"}
    cycle_weapon_firing_mode:
      - {key: "X"}
    toggle_beam:
      - {key: "B"}
    xfer_cannon_to_shields:
      - {key: "'"}
    xfer_shields_to_cannon:
      - {key: ";"}
    cycle_shield_mode:
      - {key: "S"}
    view_return_to_cockpit:
      - {key: "F1"}
    view_toggle_high_angle:
      - {key: "0"}
      - {key: "Keypad 0"}
    view_toggle_external_camera:
      - {key: "/"}
      - {key: "Keypad /"}
      - {key: "F3"}
    view_toggle_external_camera_control:
      - {key: "8", modifiers: [shift]}
      - {key: "Keypad *"}
      - {key: "F4"}
    view_toggle_cockpit:
      - {key: "."}
      - {key: "Keypad ."}
    info_goals:
      - {key: "G"}
    info_map:
      - {key: "M"}
    info_messages:
      - {key: "L"}
    info_damage:
      - {key: "D"}
    info_help:
      - {key: "K"}
    hyperspace:
      - {key: "H"}
    eject:
      - {key: "E", modifiers: [alt]}
    recorder_toggle:
      - {key: "C"}
    pause:
      - {key: "P"}
    escape: []
    confirm:
      - {key: "Space"}
    end_mission:
      - {key: "Q"}
    cycle_time_acceleration:
      - {key: "T", modifiers: [alt]}
    throttle_zero:
      - {key: "\\"}
    throttle_one_third:
      - {key: "["}
    throttle_two_thirds:
      - {key: "]"}
    toggle_slam:
      - {key: "N"}
    cycle_beam_recharge_rate:
      - {key: "F8"}
    cycle_cannon_recharge_rate:
      - {key: "F9"}
    cycle_shield_recharge_rate:
      - {key: "F10"}
    toggle_component_tracking:
      - {key: "I"}
    target_component_next:
      - {key: ","}
    target_component_prev:
      - {key: ",", modifiers: [shift]}
    target_preset_store_1:
      - {key: "F5", modifiers: [shift]}
    target_preset_store_2:
      - {key: "F6", modifiers: [shift]}
    target_preset_store_3:
      - {key: "F7", modifiers: [shift]}
    target_preset_recall_1:
      - {key: "F5"}
    target_preset_recall_2:
      - {key: "F6"}
    target_preset_recall_3:
      - {key: "F7"}
    toggle_threat_display:
      - {key: "Z"}
    roll_left_info_previous:
      - {key: "Left"}
    roll_right_info_next:
      - {key: "Right"}
    info_wingman_commands:
      - {key: "Z", modifiers: [shift]}
    recorder_view:
      - {key: "V"}
    comm_assign_target:
      - {key: "A", modifiers: [shift]}
    comm_request_resupply:
      - {key: "B", modifiers: [shift]}
    comm_cover_me:
      - {key: "C", modifiers: [shift]}
    comm_evade:
      - {key: "E", modifiers: [shift]}
    comm_continue_mission:
      - {key: "G", modifiers: [shift]}
    comm_head_home:
      - {key: "H", modifiers: [shift]}
    comm_ignore_target:
      - {key: "I", modifiers: [shift]}
    comm_report_orders:
      - {key: "R", modifiers: [shift]}
    comm_reinforcements:
      - {key: "S", modifiers: [shift]}
    comm_stop_and_wait:
      - {key: "W", modifiers: [shift]}
    view_left_shoulder:
      - {key: "1"}
      - {key: "Keypad 1"}
    view_rear:
      - {key: "2"}
      - {key: "Keypad 2"}
    view_right_shoulder:
      - {key: "3"}
      - {key: "Keypad 3"}
    view_left_wing:
      - {key: "4"}
      - {key: "Keypad 4"}
    view_straight_up:
      - {key: "5"}
      - {key: "Keypad 5"}
    view_right_wing:
      - {key: "6"}
      - {key: "Keypad 6"}
    view_left_forward:
      - {key: "7"}
      - {key: "Keypad 7"}
    view_forward:
      - {key: "8"}
      - {key: "Keypad 8"}
    view_right_forward:
      - {key: "9"}
      - {key: "Keypad 9"}

video:
  fullscreen: false
  hdr: true
  sdr_content_gamma: auto
  paper_white_nits: auto

render:
  anisotropy: 1
  msaa_samples: 2
  starfield_style: tie98
  motion_blur:
    quality: 2
    shutter: 0.5
  temporal_upscaling:
    mode: "off"
    sharpness: 0

pbr:
  light_intensity: 1
  global_specular_multiplier: 3
  light_wrap: 0
  geometric_specular_adaptation: true
  ambient_default:
    pos_x: [0.054, 0.067, 0.098]
    neg_x: [0.054, 0.067, 0.098]
    pos_y: [0.054, 0.067, 0.098]
    neg_y: [0.054, 0.067, 0.098]
    pos_z: [0.054, 0.067, 0.098]
    neg_z: [0.054, 0.067, 0.098]
    sun_color: [1, 1, 1]

point_lights:
  enabled: true
  clustered: true
  cluster_depth_slices: 24
  cluster_debug: false
  scale: 1.0
  range_scale: 1.0
  min_distance: 64.0
  spec_weight: 1.0
  diffuse_wrap: 1.0
  contrib_cap: 1.0
  training_headlight:
    enabled: true
    color: [0.823, 0.913, 1.0]
    intensity: 13333.0
    range_m: 1200.0
    nose_offset_m: 6.25
